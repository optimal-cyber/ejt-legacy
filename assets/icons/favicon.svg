<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ejt Legacy Homes">
  <rect width="64" height="64" rx="10" fill="#161513"/>
  <!-- engraved serif monogram -->
  <text x="32" y="34" text-anchor="middle" dominant-baseline="middle"
        font-family="'Cinzel', Georgia, 'Times New Roman', serif" font-weight="700"
        font-size="26" letter-spacing="1.5" fill="#F6F2E9">EL</text>
  <!-- brass divider + diamond, echoing the wordmark ornament -->
  <line x1="14" y1="48" x2="27" y2="48" stroke="#9A7B4A" stroke-width="1.6"/>
  <line x1="37" y1="48" x2="50" y2="48" stroke="#9A7B4A" stroke-width="1.6"/>
  <rect x="29.5" y="45.5" width="5" height="5" transform="rotate(45 32 48)" fill="#9A7B4A"/>
</svg>
